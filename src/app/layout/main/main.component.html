<div class="grid transition-all duration-300 ease-in-out !bg-tw-secondary-300 gap-4 p-4"
  [style.gridTemplateColumns]="gridTemplate()">
  <div class="relative">
    <q-sidebar></q-sidebar>
  </div>
  <div class="h-full" class="transition-all duration-300 ease-in-out"
    [style.width]="`calc(100vw - ${sidebarStatus() ? '21rem' : '7.25rem'})`">
    <q-header-navbar></q-header-navbar>
    <q-breadcrumb [items]="items()"></q-breadcrumb>
    <router-outlet #mainContainer />
  </div>
</div>
